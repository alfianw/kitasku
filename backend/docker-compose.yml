services:
  db:
    image: postgres:16-alpine
    container_name: kitasku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kitasku}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kitasku}
      POSTGRES_DB: ${DB_NAME:-kitasku}
    ports:
      - "5433:5432"
    volumes:
      - kitasku_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kitasku} -d ${DB_NAME:-kitasku}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitasku-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-kitasku}
      DB_PASSWORD: ${DB_PASSWORD:-kitasku}
      DB_NAME: ${DB_NAME:-kitasku}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-kitasku-local-development-secret-change-me}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-24}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3000}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kitasku.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"
    volumes:
      - kitasku_uploads:/app/uploads

volumes:
  kitasku_pgdata:
  kitasku_uploads:
